<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METFLIX — Stream Stories That Matter</title>

    <!-- Roboto Font & Google Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ==========================================================
       MATERIAL DESIGN 3 DARK CINEMATIC TOKENS
       ========================================================== */
      :root {
        --md-sys-color-background: #0e0f12;
        --md-sys-color-surface: #141518;
        --md-sys-color-surface-container: #1c1e22;
        --md-sys-color-surface-container-high: #24272d;
        --md-sys-color-surface-container-highest: #2f333b;
        --md-sys-color-primary: #e50914;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #831010;
        --md-sys-color-on-surface: #ffffff;
        --md-sys-color-on-surface-variant: #b0b3b8;
        --md-sys-color-outline: rgba(255, 255, 255, 0.12);
        --md-sys-color-chip-active: #5b1316;
        --md-sys-color-chip-active-border: #e50914;
        --radius-xs: 4px;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-full: 9999px;
        --elevation-1: 0 4px 12px rgba(0, 0, 0, 0.35);
        --elevation-2: 0 8px 24px rgba(0, 0, 0, 0.55);
        --elevation-3: 0 16px 40px rgba(0, 0, 0, 0.75);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Roboto",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-surface);
        overflow-x: hidden;
        min-height: 100vh;
      }

      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 1,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        font-size: 20px;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--md-sys-color-background);
      }
      ::-webkit-scrollbar-thumb {
        background: #282a30;
        border-radius: var(--radius-full);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3d414a;
      }

      /* ==========================================================
       TOP NAVIGATION BAR
       ========================================================== */
      .top-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 44px;
        z-index: 100;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.75) 0%,
          rgba(0, 0, 0, 0.35) 65%,
          transparent 100%
        );
        backdrop-filter: blur(8px);
        transition: background-color 0.3s ease;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        cursor: pointer;
      }

      .brand-logo svg {
        width: 28px;
        height: 32px;
        display: block;
      }

      .brand-wordmark {
        color: var(--md-sys-color-primary);
        font-size: 1.45rem;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        list-style: none;
      }

      .nav-link {
        color: #e2e4e9;
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: var(--radius-full);
        transition: all 0.2s ease;
      }

      .nav-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }

      .nav-link.active {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .profile-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: var(--radius-full);
      }

      .avatar-circle {
        width: 32px;
        height: 32px;
        background: #e50914;
        border-radius: 50%;
        color: #ffffff;
        font-weight: 700;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(229, 9, 20, 0.4);
      }

      .caret-down {
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid #ffffff;
      }

      /* ==========================================================
       HERO CINEMATIC SECTION
       ========================================================== */
      .hero-container {
        position: relative;
        height: 84vh;
        min-height: 580px;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 54px 64px;
        background: #0b0c0e;
        overflow: hidden;
      }

      .hero-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 80% center;
        z-index: 1;
        filter: brightness(0.92) contrast(1.05);
      }

      .hero-gradient {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          radial-gradient(
            circle at 80% 25%,
            rgba(229, 9, 20, 0.12) 0%,
            transparent 40%
          ),
          linear-gradient(
            90deg,
            rgba(14, 15, 18, 0.98) 0%,
            rgba(14, 15, 18, 0.88) 32%,
            rgba(14, 15, 18, 0.35) 60%,
            rgba(14, 15, 18, 0.1) 100%
          ),
          linear-gradient(
            0deg,
            #0e0f12 0%,
            rgba(14, 15, 18, 0.7) 18%,
            transparent 55%
          );
        pointer-events: none;
      }

      .hero-content {
        position: relative;
        z-index: 3;
        max-width: 600px;
      }

      .hero-eyebrow {
        color: #e50914;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 12px;
        display: block;
      }

      .hero-title {
        font-size: 3.8rem;
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.05;
        margin-bottom: 16px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      }

      .hero-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.88rem;
        color: #d4d4d8;
        margin-bottom: 16px;
        font-weight: 500;
      }

      .meta-badge {
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }

      .meta-dot {
        color: #8c8e94;
      }

      .hero-description {
        font-size: 0.98rem;
        line-height: 1.55;
        color: #cfd3da;
        margin-bottom: 28px;
        max-width: 500px;
      }

      .hero-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .btn-play-white {
        background: #ffffff;
        color: #141414;
        border: none;
        padding: 10px 26px;
        border-radius: var(--radius-full);
        font-size: 0.95rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .btn-play-white:hover {
        background: #eaeaea;
        transform: scale(1.03);
      }

      .btn-more-info {
        background: rgba(85, 90, 100, 0.55);
        backdrop-filter: blur(8px);
        color: #ffffff;
        border: none;
        padding: 10px 24px;
        border-radius: var(--radius-full);
        font-size: 0.95rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .btn-more-info:hover {
        background: rgba(105, 110, 120, 0.7);
        transform: scale(1.03);
      }

      /* ==========================================================
       CATEGORY CHIPS
       ========================================================== */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 54px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filter-bar::-webkit-scrollbar {
        display: none;
      }

      .filter-chip {
        background: #1c1e23;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e2e4e9;
        font-size: 0.86rem;
        font-weight: 500;
        padding: 7px 18px;
        border-radius: var(--radius-full);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .filter-chip:hover {
        background: #272b33;
        border-color: rgba(255, 255, 255, 0.2);
      }

      .filter-chip.active {
        background: #4d1214;
        border-color: #b5131b;
        color: #ffffff;
        font-weight: 600;
      }

      /* ==========================================================
       MOVIE ROW & CARDS
       ========================================================== */
      .catalog-section {
        padding: 10px 54px 50px;
      }

      .row-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .row-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.01em;
      }

      .row-arrows {
        display: flex;
        gap: 8px;
      }

      .arrow-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #24272f;
        border: none;
        color: #d1d5db;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .arrow-btn:hover {
        background: #363b46;
        color: #ffffff;
      }

      .movie-slider {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 16px;
        overflow-x: hidden;
        padding-bottom: 8px;
      }

      .movie-card {
        position: relative;
        height: 125px;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        background: #22252d;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition:
          transform 0.28s cubic-bezier(0.2, 0, 0, 1),
          box-shadow 0.28s ease,
          border-color 0.28s ease;
      }

      .movie-card:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: var(--elevation-2);
        border-color: rgba(229, 9, 20, 0.4);
        z-index: 5;
      }

      .movie-card-poster {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: brightness(0.85);
      }

      .movie-card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 35%,
          rgba(10, 11, 14, 0.95) 100%
        );
        padding: 12px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .movie-card-title {
        font-size: 0.88rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .movie-card-sub {
        font-size: 0.74rem;
        color: #a1a4ac;
        margin-top: 2px;
      }

      /* Gradient fallback styles */
      .grad-1 {
        background: linear-gradient(135deg, #182848 0%, #4b1248 100%);
      }
      .grad-2 {
        background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
      }
      .grad-3 {
        background: linear-gradient(135deg, #240b36 0%, #c31432 100%);
      }
      .grad-4 {
        background: linear-gradient(135deg, #093028 0%, #237a57 100%);
      }
      .grad-5 {
        background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
      }
      .grad-6 {
        background: linear-gradient(135deg, #3a1c71 0%, #d76d77 100%);
      }

      /* ==========================================================
       MODALS: VIDEO PLAYER & DETAILS
       ========================================================== */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .details-sheet {
        background: #1c1e22;
        border-radius: 16px;
        max-width: 680px;
        width: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        box-shadow: var(--elevation-3);
      }

      .details-hero {
        height: 260px;
        position: relative;
        background: #121316;
      }

      .details-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .details-hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          #1c1e22 0%,
          rgba(28, 30, 34, 0.4) 60%,
          transparent 100%
        );
      }

      .details-close {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(0, 0, 0, 0.65);
        border: none;
        color: #ffffff;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .details-body {
        padding: 22px 28px 30px;
      }

      .details-title {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .details-desc {
        font-size: 0.94rem;
        color: #cfd3da;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .details-actions {
        display: flex;
        gap: 12px;
      }

      /* Player Box */
      .player-dialog {
        background: #000000;
        width: 90vw;
        max-width: 960px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--elevation-3);
        position: relative;
      }

      .player-dialog video {
        width: 100%;
        display: block;
        max-height: 70vh;
        background: #000000;
      }

      .player-close {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(0, 0, 0, 0.7);
        border: none;
        color: #ffffff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .top-navbar {
          padding: 0 20px;
        }
        .nav-links {
          display: none;
        }
        .hero-container {
          padding: 0 24px 44px;
          height: auto;
          min-height: 480px;
        }
        .hero-title {
          font-size: 2.4rem;
        }
        .filter-bar,
        .catalog-section {
          padding-left: 20px;
          padding-right: 20px;
        }
        .movie-slider {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- TOP NAVBAR -->
    <header class="top-navbar">
      <div class="nav-left">
        <div class="brand-logo" onclick="resetView()">
          <svg
            viewBox="0 0 40 46"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M0 46L0 0H9.5L20 26L30.5 0H40V46H30.5V17L22 37.5H18L9.5 17V46H0Z"
              fill="#E50914"
            />
          </svg>
          <span class="brand-wordmark">METFLIX</span>
        </div>
        <ul class="nav-links">
          <li>
            <a
              href="#"
              class="nav-link active"
              id="nav-home"
              onclick="setView('home', event)"
              >Home</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-link"
              id="nav-movies"
              onclick="filterCategory('Movies', event)"
              >Movies</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-link"
              id="nav-tv"
              onclick="filterCategory('TV Shows', event)"
              >TV Shows</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-link"
              id="nav-mylist"
              onclick="setView('mylist', event)"
              >My List</a
            >
          </li>
        </ul>
      </div>
      <div class="nav-right">
        <button class="icon-btn" title="Search">
          <span class="material-symbols-outlined">search</span>
        </button>
        <button class="icon-btn" title="Notifications">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="profile-pill">
          <div class="avatar-circle">A</div>
          <div class="caret-down"></div>
        </button>
      </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero-container">
      <img
        src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80"
        alt="Neon Horizon Backdrop"
        class="hero-bg"
      />
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <span class="hero-eyebrow">Metflix Original Film</span>
        <h1 class="hero-title" id="hero-title">Neon Horizon</h1>
        <div class="hero-meta">
          <span id="hero-year">2025</span>
          <span class="meta-dot">·</span>
          <span class="meta-badge" id="hero-rating">PG-13</span>
          <span class="meta-dot">·</span>
          <span id="hero-duration">2h 11m</span>
          <span class="meta-dot">·</span>
          <span id="hero-genre">Sci-Fi, Adventure</span>
        </div>
        <p class="hero-description" id="hero-desc">
          A pilot discovers a mysterious signal beyond the edge of the solar
          system — and has to decide whether to answer it.
        </p>
        <div class="hero-actions">
          <button class="btn-play-white" onclick="openTrailer()">
            <span class="material-symbols-outlined">play_arrow</span> Play
          </button>
          <button class="btn-more-info" onclick="openHeroDetails()">
            <span class="material-symbols-outlined">info</span> More Info
          </button>
        </div>
      </div>
    </section>

    <!-- CATEGORY FILTER CHIPS -->
    <div class="filter-bar">
      <button
        class="filter-chip active"
        onclick="applyCategoryFilter('All', this)"
      >
        <span class="material-symbols-outlined" style="font-size: 16px"
          >check</span
        >
        All
      </button>
      <button class="filter-chip" onclick="applyCategoryFilter('Action', this)">
        Action
      </button>
      <button class="filter-chip" onclick="applyCategoryFilter('Sci-Fi', this)">
        Sci-Fi
      </button>
      <button class="filter-chip" onclick="applyCategoryFilter('Drama', this)">
        Drama
      </button>
      <button
        class="filter-chip"
        onclick="applyCategoryFilter('Mystery', this)"
      >
        Mystery
      </button>
      <button
        class="filter-chip"
        onclick="applyCategoryFilter('Thriller', this)"
      >
        Thriller
      </button>
    </div>

    <!-- TRENDING ROW -->
    <section class="catalog-section">
      <div class="row-header">
        <h2 class="row-title" id="catalog-heading">Trending on Metflix</h2>
        <div class="row-arrows">
          <button class="arrow-btn">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <button class="arrow-btn">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
      </div>
      <div class="movie-slider" id="movie-grid">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- DETAILS DIALOG -->
    <div
      class="modal-backdrop"
      id="details-modal"
      onclick="closeDetailsModal(event)"
    >
      <div class="details-sheet" onclick="event.stopPropagation()">
        <button class="details-close" onclick="closeDetailsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <div class="details-hero">
          <img id="modal-img" src="" alt="Backdrop" />
          <div class="details-hero-overlay"></div>
        </div>
        <div class="details-body">
          <h2 class="details-title" id="modal-title"></h2>
          <div class="hero-meta" style="margin-bottom: 14px">
            <span id="modal-year"></span>
            <span class="meta-dot">·</span>
            <span class="meta-badge" id="modal-rating">PG-13</span>
            <span class="meta-dot">·</span>
            <span id="modal-duration"></span>
            <span class="meta-dot">·</span>
            <span id="modal-genre" style="color: #e50914"></span>
          </div>
          <p class="details-desc" id="modal-desc"></p>
          <div class="details-actions">
            <button class="btn-play-white" onclick="openTrailer()">
              <span class="material-symbols-outlined">play_arrow</span> Play
              Trailer
            </button>
            <button
              class="btn-more-info"
              id="modal-fav-btn"
              onclick="toggleMyList()"
            >
              <span class="material-symbols-outlined" id="modal-fav-icon"
                >bookmark_add</span
              >
              <span id="modal-fav-text">Add to My List</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div class="modal-backdrop" id="video-modal" onclick="closeTrailer(event)">
      <div class="player-dialog" onclick="event.stopPropagation()">
        <button class="player-close" onclick="closeTrailer()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <video id="demo-player" controls preload="metadata">
          <source
            src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>
      </div>
    </div>

    <script>
      /* ==========================================================
       CATALOG DATA
       ========================================================== */
      const MOVIES = [
        {
          id: "neon-horizon",
          title: "Neon Horizon",
          year: "2025",
          rating: "PG-13",
          duration: "2h 11m",
          genre: "Sci-Fi, Adventure",
          category: "Sci-Fi",
          desc: "A pilot discovers a mysterious signal beyond the edge of the solar system — and has to decide whether to answer it.",
          poster:
            "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-1",
        },
        {
          id: "last-signal",
          title: "The Last Signal",
          year: "2024",
          rating: "TV-MA",
          duration: "1h 48m",
          genre: "Thriller, Mystery",
          category: "Thriller",
          desc: "A lonely radio operator in deep isolation catches a transmission that should not exist.",
          poster:
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-2",
        },
        {
          id: "shadow-protocol",
          title: "Shadow Protocol",
          year: "2025",
          rating: "PG-13",
          duration: "2h 04m",
          genre: "Action, Spy",
          category: "Action",
          desc: "An intelligence analyst uncovers a rogue clandestine operation orchestrated from inside her agency.",
          poster:
            "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-3",
        },
        {
          id: "midnight-runway",
          title: "Midnight Runway",
          year: "2023",
          rating: "R",
          duration: "1h 56m",
          genre: "Crime, Drama",
          category: "Drama",
          desc: "One fateful thunderstorm at an international airport intertwines the lives of five strangers.",
          poster:
            "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-4",
        },
        {
          id: "beyond-monsoon",
          title: "Beyond the Monsoon",
          year: "2024",
          rating: "PG-13",
          duration: "2h 15m",
          genre: "Drama",
          category: "Drama",
          desc: "Two childhood companions return to their flood-stricken coastal village to rebuild what was lost.",
          poster:
            "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-5",
        },
        {
          id: "crimson-circuit",
          title: "Crimson Circuit",
          year: "2025",
          rating: "PG-13",
          duration: "1h 52m",
          genre: "Action, Sci-Fi",
          category: "Action",
          desc: "An underground street racer uncovers that the grand championship is controlled by an adaptive neural network.",
          poster:
            "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=600&q=80",
          gradClass: "grad-6",
        },
      ];

      let currentMovie = MOVIES[0];
      let myList = JSON.parse(localStorage.getItem("metflix_mylist") || "[]");

      function renderCards(list) {
        const grid = document.getElementById("movie-grid");
        grid.innerHTML = "";
        list.forEach((movie) => {
          const card = document.createElement("div");
          card.className = `movie-card ${movie.gradClass}`;
          card.onclick = () => openDetails(movie);

          card.innerHTML = `
          <img class="movie-card-poster" src="${movie.poster}" alt="${movie.title}" onerror="this.style.display='none'">
          <div class="movie-card-overlay">
            <div class="movie-card-title">${movie.title}</div>
            <div class="movie-card-sub">${movie.year} · ${movie.genre.split(",")[0]}</div>
          </div>
        `;
          grid.appendChild(card);
        });
      }

      function applyCategoryFilter(cat, btn) {
        document.querySelectorAll(".filter-chip").forEach((c) => {
          c.classList.remove("active");
          if (c.querySelector(".material-symbols-outlined")) {
            c.querySelector(".material-symbols-outlined").remove();
          }
        });
        btn.classList.add("active");
        btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">check</span> ${cat}`;

        if (cat === "All") {
          renderCards(MOVIES);
        } else {
          const filtered = MOVIES.filter(
            (m) => m.category === cat || m.genre.includes(cat),
          );
          renderCards(filtered);
        }
      }

      function openDetails(movie) {
        currentMovie = movie;
        document.getElementById("modal-img").src = movie.poster;
        document.getElementById("modal-title").textContent = movie.title;
        document.getElementById("modal-year").textContent = movie.year;
        document.getElementById("modal-rating").textContent = movie.rating;
        document.getElementById("modal-duration").textContent = movie.duration;
        document.getElementById("modal-genre").textContent = movie.genre;
        document.getElementById("modal-desc").textContent = movie.desc;
        updateMyListBtnState();
        document.getElementById("details-modal").classList.add("open");
      }

      function openHeroDetails() {
        openDetails(MOVIES[0]);
      }

      function closeDetailsModal(e) {
        if (
          !e ||
          e.target.id === "details-modal" ||
          e.target.closest(".details-close")
        ) {
          document.getElementById("details-modal").classList.remove("open");
        }
      }

      function openTrailer() {
        const modal = document.getElementById("video-modal");
        const player = document.getElementById("demo-player");
        modal.classList.add("open");
        player.play().catch(() => {});
      }

      function closeTrailer(e) {
        if (
          !e ||
          e.target.id === "video-modal" ||
          e.target.closest(".player-close")
        ) {
          const player = document.getElementById("demo-player");
          player.pause();
          document.getElementById("video-modal").classList.remove("open");
        }
      }

      function toggleMyList() {
        const exists = myList.some((m) => m.id === currentMovie.id);
        if (exists) {
          myList = myList.filter((m) => m.id !== currentMovie.id);
        } else {
          myList.push(currentMovie);
        }
        localStorage.setItem("metflix_mylist", JSON.stringify(myList));
        updateMyListBtnState();
      }

      function updateMyListBtnState() {
        const isSaved = myList.some((m) => m.id === currentMovie.id);
        const icon = document.getElementById("modal-fav-icon");
        const text = document.getElementById("modal-fav-text");
        if (isSaved) {
          icon.textContent = "bookmark_added";
          text.textContent = "Remove from List";
        } else {
          icon.textContent = "bookmark_add";
          text.textContent = "Add to My List";
        }
      }

      function setView(view, evt) {
        if (evt) evt.preventDefault();
        document
          .querySelectorAll(".nav-link")
          .forEach((l) => l.classList.remove("active"));
        if (view === "mylist") {
          document.getElementById("nav-mylist").classList.add("active");
          document.getElementById("catalog-heading").textContent =
            "My Saved List";
          renderCards(myList.length > 0 ? myList : MOVIES);
        } else {
          document.getElementById("nav-home").classList.add("active");
          document.getElementById("catalog-heading").textContent =
            "Trending on Metflix";
          renderCards(MOVIES);
        }
      }

      function resetView() {
        setView("home");
      }

      // Initialize
      renderCards(MOVIES);
    </script>
  </body>
</html>
